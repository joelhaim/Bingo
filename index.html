<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Bingo Card</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d81f6a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bingo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Figtree:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #eef1f6; --card: #ffffff; --cell: #f7f8fb; --line: #d3d9e4; --fg: #1b2333; --muted: #5d6778;
  --ink: #d81f6a; --ink-soft: rgba(216, 31, 106, 0.78); --win: #1f8a5a;
  --display: "Rammetto One", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12161f; --card: #1b2130; --cell: #232b3c; --line: #34405a; --fg: #eef1f6; --muted: #9aa5b8;
    --ink: #ff4f93; --ink-soft: rgba(255, 79, 147, 0.72); --win: #43c98a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px; -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Account + card picker */
.account { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.account .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.account .who { color: var(--muted); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account input, .account select {
  flex: 1 1 160px; min-width: 0; font: 500 15px var(--body); color: var(--fg); background: var(--cell);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
}
.btn { border: 1px solid var(--line); background: var(--cell); color: var(--fg); font: 600 14px var(--body); padding: 9px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 4px; }
.btn:focus-visible, .account input:focus-visible, .account select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.status { color: var(--muted); font-size: 13px; min-height: 1.2em; }
.status.err { color: var(--ink); }

.title { font-family: var(--display); font-size: clamp(22px, 6vw, 30px); text-align: center; border: none; background: transparent; color: var(--fg); width: 100%; padding: 4px; border-radius: 8px; }
.title:focus-visible { outline: 2px solid var(--ink); }
.modes { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.modes button { flex: 1; border: none; background: transparent; color: var(--muted); font: 600 15px var(--body); padding: 10px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0; min-height: 1.4em; }
.board { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; box-shadow: 0 6px 24px rgba(20, 30, 50, 0.08); }
.letters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.letters span { font-family: var(--display); text-align: center; color: var(--ink); font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; background: var(--cell); border: 1px solid var(--line); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; text-align: center; font: 600 clamp(11px, 3.2vw, 15px)/1.2 var(--body);
  color: var(--fg); padding: 6px; overflow: hidden; cursor: pointer; overflow-wrap: anywhere; }
button.cell:focus-visible, textarea.cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
textarea.cell { resize: none; cursor: text; border-style: dashed; font-weight: 500; }
textarea.cell::placeholder { color: var(--muted); font-weight: 400; }
.cell .label { position: relative; z-index: 1; }
.cell.marked::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; background: var(--ink-soft); transform: rotate(-8deg); animation: daub .18s ease-out; }
.cell.marked .label { color: #fff; }
.cell.win { border-color: var(--win); box-shadow: inset 0 0 0 2px var(--win); }
@keyframes daub { from { transform: scale(.4) rotate(-8deg); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .cell.marked::before { animation: none; } }
.banner { text-align: center; font-family: var(--display); font-size: 26px; color: var(--win); margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1 1 140px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 600 15px var(--body); padding: 12px; border-radius: 12px; cursor: pointer; }
.actions button:focus-visible { outline: 2px solid var(--ink); }
.actions .danger { color: var(--ink); }
.confirm { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
/* Groups */
.groups { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.groups h2 { font-family: var(--display); font-size: 18px; margin: 0; flex: 1 1 auto; }
.groups .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.groups input, .groups select { flex: 1 1 140px; min-width: 0; font: 500 15px var(--body); color: var(--fg); background: var(--cell); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.groups input:focus-visible, .groups select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.gform { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--cell); border-radius: 12px; }
.gform input { background: var(--card); }
.ginfo { font-size: 14px; color: var(--muted); }
.ginfo strong { font-family: var(--display); font-weight: 400; color: var(--fg); letter-spacing: 0.12em; font-size: 16px; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mini { min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.mini.won { border-color: var(--win); box-shadow: inset 0 0 0 1px var(--win); }
.mini-head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; min-width: 0; }
.mini-name { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-badge { font-family: var(--display); font-size: 11px; color: var(--win); white-space: nowrap; }
.mini-count { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mini-title { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.mini-cells div { aspect-ratio: 1; border-radius: 4px; background: var(--cell); border: 1px solid var(--line); font-size: 8px; line-height: 1.1; padding: 2px; overflow: hidden; overflow-wrap: break-word; hyphens: auto; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
.mini-cells div.on { background: var(--ink-soft); border-color: transparent; color: #fff; }
.mini-cells div.w { box-shadow: inset 0 0 0 1.5px var(--win); }
.mini-empty { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <section class="account" aria-label="Account">
    <!-- No code yet -->
    <div id="acct-out" hidden>
      <div class="row">
        <input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="60" placeholder="Your personal code" aria-label="Your personal code">
        <button id="use-code" class="btn primary" type="button">Open my cards</button>
      </div>
      <div class="row">
        <button id="make-code" class="btn link" type="button">Make me a code</button>
      </div>
    </div>
    <!-- Code in use -->
    <div id="acct-in" hidden>
      <div class="row">
        <span id="who" class="who"></span>
        <button id="show-code" class="btn link" type="button">Show</button>
        <button id="forget-code" class="btn link" type="button">Use another code</button>
      </div>
      <div class="row">
        <select id="card-pick" aria-label="Your cards"></select>
        <button id="new-card" class="btn" type="button">New card</button>
      </div>
    </div>
    <div id="status" class="status" role="status"></div>
  </section>

  <input id="title" class="title" value="Party Bingo" aria-label="Card title" maxlength="40">

  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-edit" type="button">Edit squares</button>
    <button id="mode-play" type="button" aria-pressed="true">Play</button>
  </div>
  <p id="hint" class="hint"></p>

  <div class="board">
    <div class="letters" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span></div>
    <div id="grid" class="grid"></div>
  </div>

  <p id="banner" class="banner" hidden>BINGO!</p>

  <div class="actions">
    <button id="clear-marks" type="button">Clear marks</button>
    <button id="shuffle" type="button">Shuffle squares</button>
    <button id="reset" type="button" class="danger">Blank card</button>
  </div>
  <div id="confirm" class="confirm" hidden>
    <span>Erase all 16 squares?</span>
    <button id="confirm-yes" type="button" class="btn primary">Erase</button>
    <button id="confirm-no" type="button" class="btn">Cancel</button>
  </div>

  <section id="groups" class="groups" aria-label="Groups" hidden>
    <div class="row">
      <h2>Groups</h2>
      <button id="g-show-create" class="btn" type="button">Create group</button>
      <button id="g-show-join" class="btn" type="button">Join group</button>
    </div>

    <div id="g-create" class="gform" hidden>
      <input id="g-name" maxlength="30" placeholder="Group name, e.g. Saturday crew" aria-label="Group name">
      <input id="g-myname-c" maxlength="30" placeholder="Your name in the group" aria-label="Your name in the group">
      <div class="row"><button id="g-create-go" class="btn primary" type="button">Create</button><button class="btn link g-cancel" type="button">Cancel</button></div>
    </div>
    <div id="g-join" class="gform" hidden>
      <input id="g-joincode" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="6-letter group code" aria-label="Group code">
      <input id="g-myname-j" maxlength="30" placeholder="Your name in the group" aria-label="Your name in the group">
      <div class="row"><button id="g-join-go" class="btn primary" type="button">Join</button><button class="btn link g-cancel" type="button">Cancel</button></div>
    </div>

    <div id="g-current" hidden>
      <div class="row">
        <select id="g-pick" aria-label="Your groups"></select>
      </div>
      <div class="row ginfo">
        <span>Group code <strong id="g-code"></strong></span>
        <button id="g-copy" class="btn link" type="button">Copy</button>
        <span id="g-members"></span>
        <button id="g-leave" class="btn link" type="button">Leave</button>
      </div>
      <div id="g-leave-confirm" class="confirm" hidden>
        <span>Leave this group?</span>
        <button id="g-leave-yes" class="btn primary" type="button">Leave</button>
        <button id="g-leave-no" class="btn" type="button">Cancel</button>
      </div>
    </div>
    <p id="g-none" class="mini-empty">Create a group, then share its code so friends can join. Everyone in a group sees each other's cards.</p>
    <div id="g-cards" class="mini-grid"></div>
    <div id="g-status" class="status" role="status"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
(function () {
  var N = 4, KEY = "bingo4x4.v2";
  var sample = ["Someone is late", "Phone rings", "Spilled drink", "Bad pun",
    "Someone sings", "Group photo", "Pizza", "Someone yawns",
    "Dog appears", "\"I'm so full\"", "Song requests", "Someone dances",
    "Inside joke", "Lost keys", "Selfie", "Last to leave"];
  function blankMarks() { return new Array(16).fill(false); }
  var state = { id: null, title: "Party Bingo", items: sample.slice(), marks: blankMarks(), mode: "play" };

  // ---------- local storage ----------
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("bingo4x4.v1"));
    if (saved && saved.items && saved.items.length === 16) state = Object.assign(state, saved);
  } catch (e) {}
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- Supabase (personal code) ----------
  var cfg = window.BINGO_CONFIG || {};
  var CODE_KEY = "bingo.code";
  var sb = null, code = null, cards = [], codeVisible = false;
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  }
  try { code = localStorage.getItem(CODE_KEY); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status");
  function status(msg, err) { statusEl.textContent = msg || ""; statusEl.className = "status" + (err ? " err" : ""); }
  function cleanErr(e) { return (e && e.message || "Something went wrong").replace(/^.*?Code must/, "Code must"); }

  function showAccount() {
    var acct = document.querySelector(".account");
    if (!sb) { acct.hidden = true; return; }
    $("acct-out").hidden = !!code;
    $("acct-in").hidden = !code;
    if (code) {
      $("who").textContent = "Code: " + (codeVisible ? code : code.slice(0, 2) + "•••••");
      $("show-code").textContent = codeVisible ? "Hide" : "Show";
    }
  }

  var words = ["tiger","maple","comet","pepper","river","lemon","otter","cactus","rocket","velvet","mango","harbor","pixel","cobalt","willow","falcon","ember","juniper","koala","nova","quartz","sable","tulip","zephyr"];
  $("make-code").addEventListener("click", function () {
    var a = new Uint32Array(3); crypto.getRandomValues(a);
    $("code").value = words[a[0] % words.length] + "-" + words[a[1] % words.length] + "-" + (10 + a[2] % 90);
    status("Write this code down. It's the only way to get your cards back on another device.");
  });
  $("use-code").addEventListener("click", function () {
    var c = $("code").value.trim().toLowerCase();
    if (c.length < 6) { status("Use at least 6 characters. Longer is safer.", true); return; }
    code = c; codeVisible = false;
    try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
    state.id = null; showAccount(); loadCards(); loadGroups(); startPolling();
  });
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("use-code").click(); });
  $("show-code").addEventListener("click", function () { codeVisible = !codeVisible; showAccount(); });
  $("forget-code").addEventListener("click", async function () {
    await flushCloud();
    code = null; cards = []; state.id = null; $("code").value = "";
    try { localStorage.removeItem(CODE_KEY); } catch (e) {}
    saveLocal(); status(""); groups = []; setGroup(null); $("g-cards").innerHTML = ""; clearInterval(pollTimer); showAccount();
  });

  async function loadCards() {
    status("Loading your cards…");
    var r = await sb.rpc("list_cards", { p_code: code });
    if (r.error) { status("Couldn't load cards: " + cleanErr(r.error), true); return; }
    cards = r.data || [];
    if (!cards.length) { await saveCloud(true); status("New code. Your current card is saved under it."); return; }
    var current = state.id && cards.find(function (c) { return c.id === state.id; });
    applyCard(current || cards[0]);
    fillPicker(); status("Loaded " + cards.length + (cards.length === 1 ? " card" : " cards"));
  }
  function applyCard(c) {
    state.id = c.id; state.title = c.title;
    state.items = (c.items && c.items.length === 16) ? c.items : new Array(16).fill("");
    state.marks = (c.marks && c.marks.length === 16) ? c.marks : blankMarks();
    saveLocal(); render();
  }
  function fillPicker() {
    var sel = $("card-pick"); sel.innerHTML = "";
    cards.forEach(function (c) {
      var o = document.createElement("option"); o.value = c.id; o.textContent = c.title || "Untitled";
      if (c.id === state.id) o.selected = true; sel.appendChild(o);
    });
  }
  $("card-pick").addEventListener("change", async function (e) {
    await flushCloud();
    var c = cards.find(function (x) { return x.id === e.target.value; });
    if (c) applyCard(c);
  });
  $("new-card").addEventListener("click", async function () {
    await flushCloud();
    state.id = null; state.title = "New Bingo"; state.items = new Array(16).fill(""); state.marks = blankMarks(); state.mode = "edit";
    render(); await saveCloud(true);
  });

  var timer = null;
  function saveCloudSoon() { if (!sb || !code) return; clearTimeout(timer); status("Saving…"); timer = setTimeout(saveCloud, 800); }
  async function flushCloud() { if (timer) { clearTimeout(timer); timer = null; await saveCloud(); } }
  async function saveCloud(isNew) {
    timer = null;
    if (!sb || !code) return;
    var r = await sb.rpc("save_card", {
      p_code: code, p_id: isNew ? null : state.id,
      p_title: state.title || "Untitled", p_items: state.items, p_marks: state.marks
    });
    if (r.error || !r.data || !r.data[0]) {
      status(navigator.onLine === false ? "Offline. Saved on this device." : "Not saved: " + cleanErr(r.error), navigator.onLine !== false);
      return;
    }
    var row = r.data[0];
    state.id = row.id; saveLocal();
    var i = cards.findIndex(function (c) { return c.id === row.id; });
    if (i >= 0) cards[i] = row; else cards.unshift(row);
    fillPicker(); status("Saved");
    if (typeof loadGroupCards === "function" && groupId) loadGroupCards();
  }

  // ---------- groups ----------
  var GROUP_KEY = "bingo.group", NAME_KEY = "bingo.myname";
  var groups = [], groupId = null, pollTimer = null;
  try { groupId = localStorage.getItem(GROUP_KEY); } catch (e) {}
  try { var nm = localStorage.getItem(NAME_KEY) || ""; $("g-myname-c").value = nm; $("g-myname-j").value = nm; } catch (e) {}
  var gStatus = function (m, err) { var el = $("g-status"); el.textContent = m || ""; el.className = "status" + (err ? " err" : ""); };
  function rememberName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} $("g-myname-c").value = n; $("g-myname-j").value = n; }
  function setGroup(id) { groupId = id; try { id ? localStorage.setItem(GROUP_KEY, id) : localStorage.removeItem(GROUP_KEY); } catch (e) {} }

  function winSet(marks) {
    var set = {};
    lines.forEach(function (l) { if (l.every(function (i) { return marks[i]; })) l.forEach(function (i) { set[i] = true; }); });
    return set;
  }

  function showForm(which) {
    $("g-create").hidden = which !== "create"; $("g-join").hidden = which !== "join";
    if (which) $(which === "create" ? "g-name" : "g-joincode").focus();
  }
  $("g-show-create").addEventListener("click", function () { showForm($("g-create").hidden ? "create" : null); });
  $("g-show-join").addEventListener("click", function () { showForm($("g-join").hidden ? "join" : null); });
  document.querySelectorAll(".g-cancel").forEach(function (b) { b.addEventListener("click", function () { showForm(null); }); });

  $("g-create-go").addEventListener("click", async function () {
    var myName = $("g-myname-c").value.trim();
    if (!myName) { gStatus("Add your name so others know whose card is whose.", true); return; }
    await flushCloud(); gStatus("Creating…");
    var r = await sb.rpc("create_group", { p_code: code, p_group_name: $("g-name").value, p_my_name: myName });
    if (r.error || !r.data || !r.data[0]) { gStatus("Couldn't create the group: " + cleanErr(r.error), true); return; }
    rememberName(myName); setGroup(r.data[0].group_id); showForm(null); $("g-name").value = "";
    await loadGroups();
    gStatus("Group created. Share the code " + r.data[0].join_code + " with your friends.");
  });
  $("g-join-go").addEventListener("click", async function () {
    var jc = $("g-joincode").value.trim().toUpperCase(), myName = $("g-myname-j").value.trim();
    if (jc.length !== 6) { gStatus("Group codes are 6 letters and numbers.", true); return; }
    if (!myName) { gStatus("Add your name so others know whose card is whose.", true); return; }
    await flushCloud(); gStatus("Joining…");
    var r = await sb.rpc("join_group", { p_code: code, p_join_code: jc, p_my_name: myName });
    if (r.error || !r.data || !r.data[0]) { gStatus(r.error && /No group/.test(r.error.message) ? "No group has that code. Check it and try again." : "Couldn't join: " + cleanErr(r.error), true); return; }
    rememberName(myName); setGroup(r.data[0].group_id); showForm(null); $("g-joincode").value = "";
    await loadGroups(); gStatus("Joined " + r.data[0].name + ".");
  });

  async function loadGroups() {
    if (!sb || !code) return;
    var r = await sb.rpc("my_groups", { p_code: code });
    if (r.error) { gStatus("Couldn't load groups: " + cleanErr(r.error), true); return; }
    groups = r.data || [];
    if (!groups.some(function (g) { return g.group_id === groupId; })) setGroup(groups.length ? groups[0].group_id : null);
    var sel = $("g-pick"); sel.innerHTML = "";
    groups.forEach(function (g) {
      var o = document.createElement("option"); o.value = g.group_id; o.textContent = g.name + " (as " + g.my_name + ")";
      if (g.group_id === groupId) o.selected = true; sel.appendChild(o);
    });
    renderGroupInfo(); await loadGroupCards();
  }
  function renderGroupInfo() {
    var g = groups.find(function (x) { return x.group_id === groupId; });
    $("g-current").hidden = !g; $("g-none").hidden = !!g;
    if (!g) { $("g-cards").innerHTML = ""; return; }
    $("g-code").textContent = g.join_code;
    $("g-members").textContent = g.members + (g.members == 1 ? " member" : " members");
  }
  $("g-pick").addEventListener("change", function (e) { setGroup(e.target.value); renderGroupInfo(); loadGroupCards(); });
  $("g-copy").addEventListener("click", function () {
    var t = $("g-code").textContent;
    try { navigator.clipboard.writeText(t).then(function () { gStatus("Copied " + t); }, function () { gStatus("Group code: " + t); }); }
    catch (e) { gStatus("Group code: " + t); }
  });
  $("g-leave").addEventListener("click", function () { $("g-leave-confirm").hidden = false; });
  $("g-leave-no").addEventListener("click", function () { $("g-leave-confirm").hidden = true; });
  $("g-leave-yes").addEventListener("click", async function () {
    $("g-leave-confirm").hidden = true;
    var r = await sb.rpc("leave_group", { p_code: code, p_group_id: groupId });
    if (r.error) { gStatus("Couldn't leave: " + cleanErr(r.error), true); return; }
    setGroup(null); await loadGroups(); gStatus("You left the group.");
  });

  async function loadGroupCards() {
    if (!sb || !code || !groupId) return;
    var r = await sb.rpc("group_cards", { p_code: code, p_group_id: groupId });
    if (r.error) { gStatus("Couldn't load the group's cards: " + cleanErr(r.error), true); return; }
    var box = $("g-cards"); box.innerHTML = "";
    (r.data || []).forEach(function (c) {
      var items = c.items || [], marks = c.marks || [], win = winSet(marks);
      var won = Object.keys(win).length > 0;
      var count = marks.filter(Boolean).length;
      var el = document.createElement("article"); el.className = "mini" + (won ? " won" : "");
      var head = document.createElement("div"); head.className = "mini-head";
      var name = document.createElement("span"); name.className = "mini-name"; name.textContent = c.member_name + (c.is_me ? " (you)" : "");
      var right = document.createElement("span");
      right.className = won ? "mini-badge" : "mini-count"; right.textContent = won ? "BINGO!" : (c.card_id ? count + "/16" : "");
      head.appendChild(name); head.appendChild(right); el.appendChild(head);
      if (!c.card_id) {
        var p = document.createElement("div"); p.className = "mini-empty"; p.textContent = "No card yet"; el.appendChild(p);
      } else {
        var t = document.createElement("div"); t.className = "mini-title"; t.textContent = c.title || "Untitled"; el.appendChild(t);
        var cells = document.createElement("div"); cells.className = "mini-cells";
        for (var i = 0; i < 16; i++) {
          var d = document.createElement("div");
          d.className = (marks[i] ? "on" : "") + (win[i] ? " w" : "");
          d.textContent = items[i] || ""; d.title = items[i] || "";
          cells.appendChild(d);
        }
        el.appendChild(cells);
      }
      box.appendChild(el);
    });
    if ($("g-status").className.indexOf("err") >= 0) gStatus("");
  }

  function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(function () { if (document.visibilityState === "visible" && groupId) loadGroupCards(); }, 8000);
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && groupId) loadGroupCards(); });

  function showGroups() { $("groups").hidden = !(sb && code); }
  var _showAccount = showAccount;
  showAccount = function () { _showAccount(); showGroups(); };

  // Keep this device's storage (your code) from being cleared by the browser.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

  showAccount();
  if (sb && code) { loadCards(); loadGroups(); startPolling(); }

  // ---------- board ----------
  var grid = $("grid"), titleEl = $("title"), hint = $("hint"), banner = $("banner");
  var lines = [];
  for (var r = 0; r < N; r++) { var row = []; for (var c = 0; c < N; c++) row.push(r * N + c); lines.push(row); }
  for (var c2 = 0; c2 < N; c2++) { var col = []; for (var r2 = 0; r2 < N; r2++) col.push(r2 * N + c2); lines.push(col); }
  lines.push([0, 5, 10, 15]); lines.push([3, 6, 9, 12]);
  function winners() {
    var set = {};
    lines.forEach(function (l) { if (l.every(function (i) { return state.marks[i]; })) l.forEach(function (i) { set[i] = true; }); });
    return set;
  }
  function changed() { saveLocal(); saveCloudSoon(); }

  function render() {
    var editing = state.mode === "edit";
    $("mode-edit").setAttribute("aria-pressed", editing);
    $("mode-play").setAttribute("aria-pressed", !editing);
    titleEl.readOnly = !editing; titleEl.value = state.title;
    hint.textContent = editing ? "Tap a square and type what goes in it." : "Tap a square to mark it. Get 4 in a row to win.";
    grid.innerHTML = "";
    var win = editing ? {} : winners();
    state.items.forEach(function (text, i) {
      var el;
      if (editing) {
        el = document.createElement("textarea");
        el.className = "cell"; el.id = "cell-" + i; el.value = text; el.maxLength = 60;
        el.placeholder = "Square " + (i + 1); el.setAttribute("aria-label", "Square " + (i + 1));
        el.addEventListener("input", function () { state.items[i] = el.value; changed(); });
      } else {
        el = document.createElement("button");
        el.type = "button"; el.className = "cell" + (state.marks[i] ? " marked" : "") + (win[i] ? " win" : "");
        el.id = "cell-" + i; el.setAttribute("aria-pressed", state.marks[i]);
        var span = document.createElement("span"); span.className = "label"; span.textContent = text || "—";
        el.appendChild(span);
        el.addEventListener("click", function () { state.marks[i] = !state.marks[i]; changed(); render(); });
      }
      grid.appendChild(el);
    });
    banner.hidden = editing || Object.keys(win).length === 0;
  }

  titleEl.addEventListener("input", function () { state.title = titleEl.value; changed(); });
  $("mode-edit").addEventListener("click", function () { state.mode = "edit"; saveLocal(); render(); });
  $("mode-play").addEventListener("click", function () { state.mode = "play"; saveLocal(); render(); });
  $("clear-marks").addEventListener("click", function () { state.marks = blankMarks(); changed(); render(); });
  $("shuffle").addEventListener("click", function () {
    var a = state.items;
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    state.marks = blankMarks(); changed(); render();
  });
  var confirmBox = $("confirm");
  $("reset").addEventListener("click", function () { confirmBox.hidden = false; });
  $("confirm-no").addEventListener("click", function () { confirmBox.hidden = true; });
  $("confirm-yes").addEventListener("click", function () {
    state.items = new Array(16).fill(""); state.marks = blankMarks(); state.mode = "edit";
    confirmBox.hidden = true; changed(); render();
  });
  window.addEventListener("online", function () { if (code) saveCloud(); });

  render();

  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }
})();
</script>
</body>
</html>
